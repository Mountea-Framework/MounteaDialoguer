			@font-face { font-family: "Inter"; font-weight: 600; src: url("assets/fonts/inter-latin-600-normal.woff2") format("woff2"); }

				position: absolute; inset: 0; opacity: 0.8;
				background-image: radial-gradient(var(--dots) 2px, transparent 2px); background-size: 40px 40px;
			}
			#bg { background: var(--bgc); }
			.layer { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
			.still { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
			.reveal { position: absolute; inset: 0; }

				display: inline-block; font-size: 64px; font-weight: 700; letter-spacing: -0.02em; color: var(--capText);

			}

			.toggle { position: absolute; border-radius: 32px; background: var(--chipBg); border: 2px solid var(--border); opacity: 0; }
			.toggle .knob {
				position: absolute; left: 6px; top: 6px; width: 48px; height: 48px; border-radius: 50%;
				background: var(--knobBg); color: var(--knobFg); display: flex; align-items: center; justify-content: center;

			.cursor { position: absolute; left: 0; top: 0; width: 44px; height: 44px; opacity: 0; }
